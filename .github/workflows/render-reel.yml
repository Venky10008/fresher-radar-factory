name: Render reel

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job JSON (paste the content of sample-job.json)"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 || true
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

      - name: Install packages
        run: |
          npm install --no-audit --no-fund
          pip install edge-tts

      - name: Make voice-over and props
        env:
          JOB_JSON: ${{ inputs.job }}
        run: python scripts/make_assets.py

      - name: Get Chrome for Remotion
        run: npx remotion browser ensure

      - name: Render video
        run: npx remotion render src/index.ts RadarReel out/reel.mp4 --props=public/props.json

      - name: Save the video
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/reel.mp4
          retention-days: 14
