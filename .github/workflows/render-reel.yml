name: Render reel

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job JSON (paste the content of sample-job.json)"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chrome libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 libasound2t64 || true
          sudo apt-get install -y ffmpeg || true
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install packages
        run: |
          npm install --no-audit --no-fund
          pip install edge-tts gTTS

      - name: Make voice, pictures, music and props
        shell: bash
        env:
          JOB_JSON: ${{ inputs.job }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          mkdir -p out
          python scripts/make_assets.py 2>&1 | tee out/build-log.txt

      - name: Get Chrome for Remotion
        run: npx remotion browser ensure

      - name: Render video
        run: npx remotion render src/index.ts RadarReel out/reel.mp4 --props=public/props.json

      - name: Save the video and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: |
            out/reel.mp4
            out/build-log.txt
          retention-days: 14
