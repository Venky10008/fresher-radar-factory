name: Render reel

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post ID (used for release tag reel-<post_id>)"
        required: true
        type: string
      template:
        description: "Template to render: v1 or v2"
        required: true
        type: string
        default: "v1"
      job:
        description: "Job JSON (paste the content of sample-job.json)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check make_assets.py syntax
        run: |
          python -m py_compile scripts/make_assets.py || {
            echo "::error::scripts/make_assets.py has a SyntaxError - fix it before rendering"
            exit 1
          }

      - name: Install Chrome libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 libasound2t64 || true
          sudo apt-get install -y ffmpeg || true
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install packages
        run: |
          npm install --no-audit --no-fund
          pip install edge-tts gTTS

      - name: Make voice, pictures, music and props
        shell: bash
        env:
          JOB_JSON: ${{ inputs.job }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          mkdir -p out
          python scripts/make_assets.py 2>&1 | tee out/build-log.txt

      - name: Get Chrome for Remotion
        run: npx remotion browser ensure

      - name: Render video (v1)
        if: inputs.template == 'v1'
        run: npx remotion render src/index.ts RadarReel out/reel.mp4 --props=public/props.json

      - name: Render video (v2)
        if: inputs.template == 'v2'
        run: npx remotion render src-v2/index.ts RadarReelV2 out/reel.mp4 --props=public/props.json

      - name: Save the video and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ inputs.template }}
          path: |
            out/reel.mp4
            out/build-log.txt
          retention-days: 14

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="reel-${{ inputs.post_id }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" out/reel.mp4 out/build-log.txt \
            --title "Reel ${{ inputs.post_id }} (${{ inputs.template }})" \
            --notes "Rendered from post ${{ inputs.post_id }} using template ${{ inputs.template }}"

      - name: Prune releases older than 30 days
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUTOFF=$(date -d "-30 days" +%s)
          gh release list --json tagName,publishedAt --limit 100 | \
            jq -r '.[] | select(.tagName | startswith("reel-")) | "\(.tagName)\t\(.publishedAt)"' | \
            while IFS=$'\t' read -r tag published; do
              published_epoch=$(date -d "$published" +%s 2>/dev/null || echo 0)
              if [ "$published_epoch" -lt "$CUTOFF" ]; then
                gh release delete "$tag" --yes 2>/dev/null || true
              fi
            done
